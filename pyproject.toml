[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "communilate"
version = "0.1.0"
description = "Heritage-adapted translation: LoRA + retrieval over NLLB-200"
requires-python = ">=3.10"

[project.optional-dependencies]
# COMET is optional: it is the most fragile dependency in the project and
# the eval code degrades gracefully without it.
comet = ["unbabel-comet>=2.2"]

[project.scripts]
communilate = "communilate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
